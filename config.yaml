lr: 0.0001
batch_size: 4
num_epochs: 10

train_paths:
    - 'C:\Users\DELL\.cache\kagglehub\datasets\xhlulu\140k-real-and-fake-faces\versions\2\real_vs_fake\real-vs-fake\train'

val_paths:
    - 'C:\Users\DELL\.cache\kagglehub\datasets\xhlulu\140k-real-and-fake-faces\versions\2\real_vs_fake\real-vs-fake\valid'

early_stopping_patience: 3
scheduler_factor: 0.5
scheduler_patience: 2
monitor_metric: val_balanced_acc

log_every_n_steps: 50
save_top_k: 1

# Set this to "models/last.ckpt" to continue the most recently saved checkpoint.
# Leave as null to start a fresh training run.
resume_from_checkpoint: null

# Save the recovery checkpoint every N training batches.
# This limits how much progress is lost if training is interrupted.
checkpoint_every_n_steps: 500
